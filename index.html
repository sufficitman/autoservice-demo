<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Автосервис — демо</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f3f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#142342;color:#fff;padding:28px 18px}.brand{font-weight:750;font-size:22px}.sub{font-size:13px;color:#aebbd4;margin-top:5px}.nav{display:grid;gap:8px;margin-top:35px}.nav button{background:transparent;color:#dce5f5;border:0;text-align:left;padding:13px 14px;border-radius:10px;cursor:pointer;font-size:15px}.nav button:hover,.nav button.active{background:#2a3c61;color:#fff}.main{padding:32px;max-width:1500px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.head h1{font-size:30px;margin:0}.muted{color:#71809a;margin:6px 0 0}.btn{border:0;border-radius:10px;background:#2557e6;color:white;padding:11px 16px;font-weight:650;cursor:pointer}.btn:hover{background:#1647ce}.btn.light{background:#eef3ff;color:#2557e6}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel{background:#fff;border-radius:16px;box-shadow:0 7px 26px #1423420c}.stat{padding:20px}.stat span{color:#71809a;font-size:14px}.stat strong{display:block;font-size:28px;margin-top:8px}.panel{padding:20px;margin-bottom:20px}.panel h2{font-size:18px;margin:0 0 16px}.tools{display:flex;gap:10px;margin-bottom:14px}.search{width:min(430px,100%);padding:11px 13px;border:1px solid #dce3ef;border-radius:10px;font:inherit}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e9edf5;vertical-align:top}th{font-size:13px;color:#738099;font-weight:650}td{font-size:14px}.link{color:#2557e6;font-weight:650;border:0;background:none;cursor:pointer;padding:0;font:inherit}.tag{background:#edf3ff;color:#2557e6;border-radius:30px;padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.info{padding:15px;border-radius:12px;background:#f7f9fd}.info small{display:block;color:#738099;margin-bottom:7px}.info b{overflow-wrap:anywhere}.empty{text-align:center;color:#8390a6;padding:22px}.timeline{display:grid;gap:12px}.visit{border:1px solid #e7ecf4;padding:15px;border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.visit b{display:block;margin-bottom:5px}.overlay{position:fixed;inset:0;background:#101a2c88;display:grid;place-items:center;padding:15px;z-index:3}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:23px}.modal h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#65728a}.field input,.field select,.field textarea{font:inherit;border:1px solid #d8dfeb;border-radius:9px;padding:10px 11px;background:white;width:100%}.field textarea{min-height:70px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.line-items{margin:13px 0}.line{display:grid;grid-template-columns:2fr .7fr 1fr 36px;gap:7px;margin:8px 0}.line input{width:100%;padding:9px;border:1px solid #d8dfeb;border-radius:8px}.remove{border:0;border-radius:8px;background:#fff0f0;color:#be4242;font-size:18px;cursor:pointer}.sum{font-size:20px;font-weight:750;text-align:right;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;background:#142342;color:#fff;padding:12px 16px;border-radius:10px;z-index:5}.small{font-size:13px;color:#77839a}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.back{border:0;background:transparent;color:#2557e6;font-weight:650;cursor:pointer;padding:0;margin:0 0 12px}.warning{background:#fff8e6;border:1px solid #f4e2aa;color:#795a12;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:20px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:16px 18px}.nav{display:flex;margin-top:16px;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.head{flex-direction:column}.cards{grid-template-columns:1fr 1fr}.grid,.two{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.line{grid-template-columns:1fr 1fr}.line .remove{grid-column:2}.visit{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="app"></div><script>
const seed={clients:[{id:1,name:'Иванов Сергей',phone:'+7 999 123-45-67',note:'Постоянный клиент'},{id:2,name:'Петров Алексей',phone:'+7 999 765-43-21',note:'Обслуживает два автомобиля'}],cars:[{id:1,clientId:1,brand:'Toyota',model:'Camry',year:2018,plate:'А123АА 77',vin:'XW7BF3HK90S123456',engine:'2.5 бензин',transmission:'Автомат',mileage:142000,note:'Обслуживание каждые 10 000 км'},{id:2,clientId:2,brand:'Kia',model:'Rio',year:2020,plate:'В456ВВ 77',vin:'Z94C251BBLR654321',engine:'1.6 бензин',transmission:'Автомат',mileage:88000,note:'Контроль ходовой'}],visits:[{id:1,carId:1,date:'2026-11-01',mileage:142000,complaint:'Плановое ТО, замена масла',comment:'Работы выполнены без замечаний',services:[{name:'Замена масла',qty:1,price:1500},{name:'Диагностика ходовой',qty:1,price:1000}],parts:[{name:'Масло 5W-30',article:'OIL-530',qty:1,price:4500},{name:'Масляный фильтр',article:'FIL-001',qty:1,price:1500}]},{id:2,carId:1,date:'2026-09-10',mileage:138000,complaint:'Скрип при торможении',comment:'Заменены передние колодки',services:[{name:'Замена тормозных колодок',qty:1,price:2500}],parts:[{name:'Тормозные колодки передние',article:'PAD-778',qty:1,price:9500}]},{id:3,carId:2,date:'2026-10-15',mileage:88000,complaint:'Плановая диагностика',comment:'Рекомендована замена стоек стабилизатора позже',services:[{name:'Диагностика ходовой',qty:1,price:1000}],parts:[]} ]};
let db;try{db=JSON.parse(localStorage.getItem('autoservice-demo-db'))||seed}catch{db=seed}let page='home',search='',selectedCar=null,toastTimer;const app=document.getElementById('app');const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('autoservice-demo-db',JSON.stringify(db))}function client(id){return db.clients.find(x=>x.id==id)}function car(id){return db.cars.find(x=>x.id==id)}function total(v){return [...v.services,...v.parts].reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.price)||0),0)}function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2300)}function setPage(p){page=p;search='';render()}function header(title,sub='',action=''){return `<div class="head"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}function button(text,fn=''){return `<button class="btn" ${fn?`onclick="${fn}"`:''}>${text}</button>`}function table(headers,rows){return `<div style="overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">Записей пока нет</td></tr>`}</tbody></table></div>`}
function render(){let body='';if(page==='home'){let recent=[...db.visits].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);body=header('Главная','Демо-приложение для сотрудников автосервиса')+`<div class="warning">Демо: данные сохраняются в этом браузере на этом устройстве. Не вводите реальные персональные данные.</div><div class="cards"><div class="stat"><span>Клиенты</span><strong>${db.clients.length}</strong></div><div class="stat"><span>Автомобили</span><strong>${db.cars.length}</strong></div><div class="stat"><span>Визиты</span><strong>${db.visits.length}</strong></div></div><section class="panel"><h2>Последние визиты</h2>${table(['Дата','Автомобиль','Клиент','Пробег','Причина','Сумма'],recent.map(v=>{let c=car(v.carId);return `<tr><td>${esc(v.date)}</td><td>${esc(c?.brand)} ${esc(c?.model)}</td><td>${esc(client(c?.clientId)?.name)}</td><td>${Number(v.mileage).toLocaleString('ru-RU')} км</td><td>${esc(v.complaint)}</td><td>${money(total(v))}</td></tr>`}).join(''))}</section>`}
if(page==='clients'){let list=db.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase()));body=header('Клиенты','Владельцы автомобилей',button('＋ Добавить клиента','openClient()'))+`<section class="panel"><div class="tools"><input class="search" placeholder="Поиск по ФИО или телефону" value="${esc(search)}" oninput="search=this.value;render()"></div>${table(['ФИО','Телефон','Автомобили','Комментарий',''],list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${db.cars.filter(x=>x.clientId===c.id).length}</td><td>${esc(c.note||'—')}</td><td><button class="link" onclick="showClient(${c.id})">Открыть</button></td></tr>`).join(''))}</section>`}
if(page==='cars'){let list=db.cars.filter(c=>(c.brand+' '+c.model+' '+c.plate+' '+c.vin+' '+(client(c.clientId)?.name||'')).toLowerCase().includes(search.toLowerCase()));body=header('Автомобили','Карточки автомобилей и история обслуживания',button('＋ Добавить автомобиль','openCar()'))+`<section class="panel"><div class="tools"><input class="search" placeholder="Поиск по владельцу, марке, номеру или VIN" value="${esc(search)}" oninput="search=this.value;render()"></div>${table(['Клиент','Автомобиль','Госномер','VIN','Пробег',''],list.map(c=>`<tr><td>${esc(client(c.clientId)?.name)}</td><td><b>${esc(c.brand)} ${esc(c.model)}</b> · ${esc(c.year)}</td><td>${esc(c.plate||'—')}</td><td>${esc(c.vin||'—')}</td><td>${Number(c.mileage).toLocaleString('ru-RU')} км</td><td><button class="link" onclick="showCar(${c.id})">Открыть</button></td></tr>`).join(''))}</section>`}
if(page==='client-detail'){let c=client(selectedCar);if(!c){page='clients';return render()}let cs=db.cars.filter(x=>x.clientId===c.id);body=`<button class="back" onclick="setPage('clients')">← К списку клиентов</button>`+header(esc(c.name),esc(c.phone))+`<section class="panel"><h2>Комментарий</h2><p>${esc(c.note||'Нет комментария')}</p></section><section class="panel"><h2>Автомобили клиента</h2>${table(['Автомобиль','Госномер','Пробег',''],cs.map(x=>`<tr><td>${esc(x.brand)} ${esc(x.model)} · ${esc(x.year)}</td><td>${esc(x.plate||'—')}</td><td>${Number(x.mileage).toLocaleString('ru-RU')} км</td><td><button class="link" onclick="showCar(${x.id})">История</button></td></tr>`).join(''))}</section>`}
if(page==='car-detail'){let c=car(selectedCar);if(!c){page='cars';return render()}let visits=db.visits.filter(v=>v.carId===c.id).sort((a,b)=>b.date.localeCompare(a.date));body=`<button class="back" onclick="setPage('cars')">← К списку автомобилей</button>`+header(`${esc(c.brand)} ${esc(c.model)} ${esc(c.year)}`,`${esc(client(c.clientId)?.name)} · ${esc(c.plate)}`,button('＋ Новый визит',`openVisit(${c.id})`))+`<div class="grid">${[['Владелец',client(c.clientId)?.name],['Госномер',c.plate||'—'],['VIN',c.vin||'—'],['Пробег',Number(c.mileage).toLocaleString('ru-RU')+' км'],['Двигатель',c.engine||'—'],['Коробка',c.transmission||'—'],['Комментарий',c.note||'—']].map(([a,b])=>`<div class="info"><small>${a}</small><b>${esc(b)}</b></div>`).join('')}</div><section class="panel"><h2>История обслуживания</h2><div class="timeline">${visits.length?visits.map(v=>`<div class="visit"><div><b>${esc(v.date)} · ${Number(v.mileage).toLocaleString('ru-RU')} км</b><span class="small">${esc(v.complaint||'Без описания')}</span></div><div><span class="tag">${money(total(v))}</span> <button class="link" onclick="showVisit(${v.id})">Открыть</button></div></div>`).join(''):'<div class="empty">Визитов пока нет</div>'}</div></section>`}
if(page==='visit-detail'){let v=db.visits.find(x=>x.id===selectedCar);if(!v){page='cars';return render()}let c=car(v.carId);body=`<button class="back" onclick="showCar(${c.id})">← К автомобилю</button>`+header(`Визит от ${esc(v.date)}`,`${esc(c.brand)} ${esc(c.model)} · ${esc(client(c.clientId)?.name)}`)+`<div class="grid">${[['Пробег',Number(v.mileage).toLocaleString('ru-RU')+' км'],['Жалоба',v.complaint||'—'],['Комментарий',v.comment||'—'],['Итог',money(total(v))]].map(([a,b])=>`<div class="info"><small>${a}</small><b>${esc(b)}</b></div>`).join('')}</div><div class="two"><section class="panel"><h2>Работы</h2>${table(['Наименование','Кол-во','Цена','Сумма'],v.services.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join(''))}</section><section class="panel"><h2>Запчасти</h2>${table(['Наименование','Артикул','Кол-во','Сумма'],v.parts.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.article||'—')}</td><td>${x.qty}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')||'<tr><td class="empty" colspan="4">Запчасти не добавлены</td></tr>')}</section></div>`}
app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">Автосервис</div><div class="sub">Демо-версия · MVP</div><nav class="nav"><button class="${page==='home'?'active':''}" onclick="setPage('home')">Главная</button><button class="${page.startsWith('client')?'active':''}" onclick="setPage('clients')">Клиенты</button><button class="${page.startsWith('car')||page==='visit-detail'?'active':''}" onclick="setPage('cars')">Автомобили</button></nav><div class="sub" style="margin-top:auto;line-height:1.5">Пример интерфейса.<br>Данные хранятся локально.</div></aside><main class="main">${body}</main></div>`}
function showClient(id){selectedCar=id;setPage('client-detail')}function showCar(id){selectedCar=id;setPage('car-detail')}function showVisit(id){selectedCar=id;setPage('visit-detail')}
function modal(title,fields,submit){let wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML=`<form class="modal" id="modalForm"><h2>${title}</h2><div class="form">${fields}</div><div class="modal-actions"><button type="button" class="btn light" onclick="this.closest('.overlay').remove()">Отмена</button><button class="btn">Сохранить</button></div></form>`;document.body.append(wrap);wrap.querySelector('form').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));wrap.remove()}}
const field=(name,label,placeholder='',type='text',full=false)=>`<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${['name','brand','model'].includes(name)?'required':''}></div>`;
function openClient(){modal('Новый клиент',field('name','ФИО','Например, Иванов Сергей')+field('phone','Телефон','+7 900 000-00-00','tel')+field('note','Комментарий','Необязательно','text',true),f=>{db.clients.push({id:Date.now(),name:f.get('name'),phone:f.get('phone'),note:f.get('note')});save();render();toast('Клиент добавлен')})}
function openCar(){let opts=db.clients.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone)}</option>`).join('');modal('Новый автомобиль',`<div class="field full"><label>Клиент</label><select name="clientId" required>${opts||'<option value="">Сначала добавьте клиента</option>'}</select></div>${field('brand','Марка','Toyota')}${field('model','Модель','Camry')}${field('year','Год','2018','number')}${field('plate','Госномер','А123АА 77')}${field('vin','VIN','17 символов', 'text',true)}${field('engine','Двигатель','2.5 бензин')}${field('transmission','Коробка передач','Автомат')}${field('mileage','Пробег','0','number')}`,f=>{db.cars.push({id:Date.now(),clientId:Number(f.get('clientId')),brand:f.get('brand'),model:f.get('model'),year:Number(f.get('year'))||'',plate:f.get('plate'),vin:f.get('vin'),engine:f.get('engine'),transmission:f.get('transmission'),mileage:Number(f.get('mileage'))||0,note:''});save();render();toast('Автомобиль добавлен')})}
function openVisit(carId){let c=car(carId);let wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML=`<form class="modal" id="visitForm"><h2>Новый визит · ${esc(c.brand)} ${esc(c.model)}</h2><div class="form">${field('date','Дата визита',new Date().toISOString().slice(0,10),'date')}${field('mileage','Пробег, км',String(c.mileage),'number')}<div class="field full"><label>Жалоба / причина обращения</label><textarea name="complaint" placeholder="Например, плановое ТО"></textarea></div><div class="field full"><label>Комментарий мастера</label><textarea name="comment" placeholder="Что сделано или рекомендации"></textarea></div></div><div class="line-items"><h3>Работы <button type="button" class="btn light" onclick="addLine('services')">＋ Добавить</button></h3><div id="servicesLines"></div></div><div class="line-items"><h3>Запчасти <button type="button" class="btn light" onclick="addLine('parts')">＋ Добавить</button></h3><div id="partsLines"></div></div><div class="sum" id="visitSum">Итого: 0 ₽</div><div class="modal-actions"><button type="button" class="btn light" onclick="this.closest('.overlay').remove()">Отмена</button><button class="btn">Сохранить визит</button></div></form>`;document.body.append(wrap);window.addLine=kind=>{let container=wrap.querySelector(kind==='services'?'#servicesLines':'#partsLines');let row=document.createElement('div');row.className='line';row.innerHTML=`<input placeholder="${kind==='services'?'Название работы':'Название запчасти'}" class="ln-name">${kind==='parts'?'<input placeholder="Артикул" class="ln-article">':''}<input type="number" min="0" step="0.01" value="1" class="ln-qty" placeholder="Кол-во"><input type="number" min="0" step="0.01" value="0" class="ln-price" placeholder="Цена"><button type="button" class="remove" title="Удалить">×</button>`;row.querySelector('.remove').onclick=()=>{row.remove();calc()};row.querySelectorAll('input').forEach(i=>i.oninput=calc);container.append(row);calc()};function calc(){let sum=0;wrap.querySelectorAll('.line').forEach(r=>sum+=(Number(r.querySelector('.ln-qty').value)||0)*(Number(r.querySelector('.ln-price').value)||0));wrap.querySelector('#visitSum').textContent='Итого: '+money(sum)}wrap.querySelector('#visitForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let services=[...wrap.querySelectorAll('#servicesLines .line')].filter(r=>r.querySelector('.ln-name').value.trim()).map(r=>({name:r.querySelector('.ln-name').value,qty:Number(r.querySelector('.ln-qty').value)||0,price:Number(r.querySelector('.ln-price').value)||0}));let parts=[...wrap.querySelectorAll('#partsLines .line')].filter(r=>r.querySelector('.ln-name').value.trim()).map(r=>({name:r.querySelector('.ln-name').value,article:r.querySelector('.ln-article')?.value||'',qty:Number(r.querySelector('.ln-qty').value)||0,price:Number(r.querySelector('.ln-price').value)||0}));let mileage=Number(f.get('mileage'))||0;db.visits.push({id:Date.now(),carId,date:f.get('date')||new Date().toISOString().slice(0,10),mileage,complaint:f.get('complaint'),comment:f.get('comment'),services,parts});c.mileage=Math.max(c.mileage,mileage);save();wrap.remove();render();toast('Визит сохранён')};window.addLine('services')}
render();
</script></body></html>
